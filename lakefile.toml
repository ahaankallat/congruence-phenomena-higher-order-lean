name = "congruencetheoryhigherorder"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CongruenceTheoryHigherOrder"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "congruencetheory"
git = "https://github.com/ahaankallat/congruence-phenomena-lean"
rev = "master"

[[lean_lib]]
name = "CongruenceTheoryHigherOrder"
